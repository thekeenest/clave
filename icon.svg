<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="156" y="72" width="200" height="368" rx="24" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <!-- Screen area -->
  <rect x="168" y="100" width="176" height="300" rx="8" fill="url(#accent)" opacity="0.06"/>
  <!-- Key ring -->
  <circle cx="256" cy="200" r="40" fill="none" stroke="url(#accent)" stroke-width="7"/>
  <circle cx="256" cy="200" r="14" fill="url(#accent)" opacity="0.8"/>
  <!-- Key shaft -->
  <line x1="256" y1="240" x2="256" y2="360" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="256" y1="310" x2="284" y2="310" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="335" x2="276" y2="335" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <!-- Status bar dots -->
  <circle cx="246" cy="84" r="4" fill="url(#accent)" opacity="0.3"/>
  <circle cx="266" cy="84" r="4" fill="url(#accent)" opacity="0.3"/>
  <!-- Home indicator -->
  <line x1="226" y1="420" x2="286" y2="420" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
